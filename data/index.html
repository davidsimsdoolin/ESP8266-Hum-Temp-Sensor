<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Home Sensor</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background-color: #f4f4f4;
    }
    form {
        background-color: white;
        padding: 20px;
        border-radius: 8px;
        max-width: 300px;
        margin: auto;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    label {
        display: block;
        margin-top: 10px;
    }
    input {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        box-sizing: border-box;
    }
    button {
        margin-top: 15px;
        padding: 10px;
        width: 100%;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
    }
    #statusMessage {
        text-align: center;
        margin-top: 20px;
        color: #333;
    }


</style>
</head>
<body>
    <form id="SensorData">
        <h2>Sensor Data</h2>
        <div id ="temperature">Temperature: </div>
        <div id ="humidity">Humidity: </div>
    </form>
    <!--Wifi Settings Input-->
    <form id="wifiConfig">
        <h2>Wifi Settings</h2>
        <label for="ssid">SSID:</label>
        <select id="ssid">
            <option disabled selected>Loading...</option>
        </select>

	    <label for="password">Password:</label>
        <input type="password" id="password" name="password" required />

        <button type="submit">Connect</button>
        <div id="wifiStatusMessage"></div>
        <div id="statusMessage"></div>
    </form>
    

<script>
        fetch('/networks')
            .then(response => response.json())
            .then(data => {
                const select = document.getElementById('ssid');
                select.innerHTML = ''; // Clear existing options
                data.forEach(ssid => {
                    const option = document.createElement('option');
                    option.value = ssid;
                    option.textContent = ssid;
                    select.appendChild(option);
                });
            })
            .catch(err => {
                document.getElementById('statusMessage').textContent = "Failed to load networks: " + err;
            });

    function getSensorData()
    {
        fetch('/sensors')
            .then(response => response.json())
            .then(data => {
                document.getElementById('temperature').textContent = "Temperature: " + data.temperature + " °C";
                document.getElementById('humidity').textContent = "Humidity: " + data.humidity + " %";
            })
            .catch(err => {
                document.getElementById('temperature').textContent = "Error: " + err;
            });
    }

    function checkWiFiStatus()
    {
        fetch('/status', {
            method: 'POST'
        })
        .then(response => response.text())
        .then(msg => {
            const wifiStatus = document.getElementById('wifiStatusMessage');
            if (msg === 'connected') {
                wifiStatus.textContent = "✅ WiFi connected!";
                wifiStatus.style.color = "green";
            } else {
                wifiStatus.textContent = "❌ Not connected";
                wifiStatus.style.color = "red";
            }
        })
        .catch(err => {
            wifiStatus.textContent = "Error: " + err;
        });

        fetch('/connect', {
            method: 'POST'
        }).then(res => res.text())
        .then(msg => {
            const genStatus = document.getElementById('statusMessage');
            genStatus.textContent = msg;
        })
    }

    document.getElementById('wifiConfig').addEventListener('submit', function(e) {
        e.preventDefault();

        const ssid = document.getElementById('ssid').value;
        const pass = document.getElementById('password').value;

        const statusMsg = document.getElementById('statusMessage');
        statusMsg.textContent = "Submitting credentials...";

        const body = new URLSearchParams();
        body.append('ssid', ssid);
        body.append('password', pass);
        fetch('/connect', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: body.toString()
        })
        .then(res => res.text())
        .then(msg => {
            statusMsg.textContent = msg;
            document.getElementById('ssid').selectedIndex = 0;
            document.getElementById('password').value = '';
        })
        .catch(err => {document.getElementById('statusMessage').textContent = "connection Failed" + err;});
    });

    checkWiFiStatus();
    getSensorData();


    setInterval(checkWiFiStatus, 5000);
    setInterval(getSensorData, 40000)

</script>
</body>
</html>
